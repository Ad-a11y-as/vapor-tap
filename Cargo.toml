[package]
name = "vapor-tap"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform application audio capture and remote speech transcription"
license = "MIT"

[lib]
name = "vapor_tap"
path = "src/lib.rs"

[[bin]]
name = "vapor-tap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
rubato = { version = "0.16.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
flexaudio-core = "0.2"
flexaudio-os-windows = "0.2"
windows = { version = "=0.54.0", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
flexaudio-core = "0.2"
objc2 = "0.6"
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSValue", "NSString", "NSUUID"] }

[dev-dependencies]
tempfile = "3"
